<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0A0A0A"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Капитал"><link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png"><link rel="manifest" href="manifest.json"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style></head><body><title>Капитал</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: black glass hero over a quiet page; mobile = one column + floating nav pill, desktop = two columns */
:root{
  --page:#F3F3F1; --card:#E9E9E6; --card-2:#FFFFFF; --ink:#0B0B0C; --ink-2:#6A6A6E; --ink-3:#A0A0A4;
  --line:rgba(0,0,0,.07); --hero:#0A0A0A; --hero-line:rgba(255,255,255,.0); --pos:#23935A; --neg:#C2463B;
  --gold:#A27417; --bar:#D6D6D2; --bar-hi:#0B0B0C; --sheet:#F7F7F5; --field:#FFFFFF; --scrim:rgba(10,10,12,.38);
  --font:"Onest",-apple-system,"SF Pro Display","Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#060607; --card:#131315; --card-2:#1A1A1C; --ink:#F2F2F0; --ink-2:#9A9A9F; --ink-3:#5E5E63;
  --line:rgba(255,255,255,.07); --hero:#000; --hero-line:rgba(255,255,255,.09); --pos:#5BD08F; --neg:#F07A6E;
  --gold:#E4BF6C; --bar:#2A2A2D; --bar-hi:#F2F2F0; --sheet:#121214; --field:#1C1C1F; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#060607; --card:#131315; --card-2:#1A1A1C; --ink:#F2F2F0; --ink-2:#9A9A9F; --ink-3:#5E5E63;
  --line:rgba(255,255,255,.07); --hero:#000; --hero-line:rgba(255,255,255,.09); --pos:#5BD08F; --neg:#F07A6E;
  --gold:#E4BF6C; --bar:#2A2A2D; --bar-hi:#F2F2F0; --sheet:#121214; --field:#1C1C1F; --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 120px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink-2);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1180px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;margin:2px 4px 14px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.02em}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--ink-3);letter-spacing:0}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--ink)}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--hero);border:1px solid var(--hero-line);color:#F4F4F2;border-radius:34px;padding:22px 20px 22px;isolation:isolate;touch-action:pan-y}
.hero::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 70% at 50% 0%,rgba(255,255,255,.10),transparent 60%),linear-gradient(180deg,rgba(255,255,255,.03),transparent 40%);z-index:0}
.glow{position:absolute;left:0;top:0;width:320px;height:320px;margin:-160px 0 0 -160px;border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(circle,rgba(255,255,255,.34) 0%,rgba(210,214,226,.14) 32%,transparent 66%);filter:blur(6px);will-change:transform}
.glow.g2{width:220px;height:220px;margin:-110px 0 0 -110px;background:radial-gradient(circle,rgba(190,200,230,.18),transparent 66%)}
.hero>*:not(.glow){position:relative;z-index:1}
.hero-top{display:flex;justify-content:space-between;align-items:center}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;color:#0A0A0A;
  background:linear-gradient(140deg,#FFFFFF,#BDBDBD)}
.glass{position:relative;background:rgba(255,255,255,.07);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(255,255,255,.04),0 10px 30px rgba(0,0,0,.35);border-radius:999px;color:#F4F4F2}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:radial-gradient(140px circle at var(--lx,50%) var(--ly,-40%),rgba(255,255,255,.75),rgba(255,255,255,.14) 45%,rgba(255,255,255,.08) 70%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(90px circle at var(--lx,50%) var(--ly,-40%),rgba(255,255,255,.16),transparent 70%)}
.glass.round{width:42px;height:42px;display:grid;place-items:center}
.wallet-sel{display:flex;align-items:center;gap:6px;margin:22px auto 6px;font-size:15px;font-weight:500;color:#D9D9D7;width:max-content}
.wallet-sel svg{width:16px;height:16px}
.big{text-align:center;font-weight:800;font-size:clamp(40px,12vw,62px);line-height:1.02;letter-spacing:-.045em;white-space:nowrap;
  background:linear-gradient(180deg,#FFFFFF 30%,#9C9C9C 110%);-webkit-background-clip:text;background-clip:text;color:transparent}
.big .kop{background:linear-gradient(180deg,#6E6E6E,#444);-webkit-background-clip:text;background-clip:text}
.big .cur{font-weight:700;font-size:.62em;margin-left:.12em}
.usd{text-align:center;font-size:17px;font-weight:600;color:#CFCFCC;margin-top:8px}
.usd span{color:#7C7C7C;font-weight:500;font-size:14px}
.fc{display:flex;gap:12px;align-items:flex-start;margin:20px auto 0;max-width:420px;padding:12px 16px;border-radius:20px;text-align:left}
.fc .dot{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.1)}
.fc .dot svg{width:16px;height:16px}
.fc b{display:block;font-weight:600;font-size:14px;line-height:1.3}
.fc small{display:block;font-size:12.5px;color:#9B9B9B;margin-top:3px;line-height:1.35}
.actions{display:flex;justify-content:center;align-items:center;gap:14px;margin:24px 0 18px}
.act{height:48px;padding:0 20px 0 16px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.act svg{width:18px;height:18px}
.act.plus{width:66px;height:66px;padding:0;justify-content:center;border-radius:50%}
.act.plus svg{width:26px;height:26px;stroke-width:1.6}
.sync{display:flex;align-items:center;gap:8px;margin:0 auto;width:max-content;padding:8px 14px;font-size:12.5px;font-weight:500;color:#D0D0CE}
.sync i{width:6px;height:6px;border-radius:50%;background:#7BE39F;box-shadow:0 0 8px #7BE39F}

/* sections */
.home{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);grid-template-areas:"hero" "chart" "goals" "recent"}
@media (min-width:980px){.home{grid-template-columns:440px minmax(0,1fr);grid-template-areas:"hero chart" "goals recent";align-items:start}}
.a-hero{grid-area:hero}.a-chart{grid-area:chart}.a-goals{grid-area:goals}.a-recent{grid-area:recent}
.card{background:var(--card);border-radius:28px;padding:18px}
.card.white{background:var(--card-2)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:2px 4px 12px}
.sec-h h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em}
.sec-h button{font-size:13.5px;color:var(--ink-2);font-weight:500;display:flex;align-items:center;gap:2px}
.sec-h button svg{width:16px;height:16px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card-2);border-radius:22px;padding:14px 16px}
.kpi .l{font-size:12.5px;color:var(--ink-2);font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .l svg{width:15px;height:15px}
.kpi .v{font-size:clamp(20px,5.4vw,26px);font-weight:800;margin-top:6px;letter-spacing:-.035em;white-space:nowrap}
.kpi .d{font-size:12px;font-weight:600;margin-top:4px;color:var(--ink-3)}
.up{color:var(--pos)!important}.down{color:var(--neg)!important}
.chartbox{margin-top:16px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink-2);margin:0 4px 6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
svg.ch{width:100%;height:auto;display:block;overflow:visible}
.ch text{fill:var(--ink-3);font-size:11px;font-family:var(--font)}

/* rows */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:22px;padding:12px 14px;text-align:left;width:100%}
.card .row{background:var(--card-2)}
.ico{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:15px;background:var(--ink);color:var(--page)}
.ico.soft{background:var(--page);color:var(--ink)}
.card .ico.soft{background:var(--card)}
.ico svg{width:18px;height:18px}
.row .mid{flex:1;min-width:0}
.row .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;flex:none}
.row .r .t{font-weight:700}
.dayh{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);font-weight:500;margin:14px 6px 6px}
.dayh:first-child{margin-top:0}

/* goals */
.goal{background:var(--card-2);border-radius:22px;padding:14px 16px;text-align:left;width:100%;display:block}
.goal .gt{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.goal .gt b{font-size:15px;font-weight:600}
.goal .gt span{font-size:13px;color:var(--ink-2);font-weight:600}
.goal .gv{font-size:22px;font-weight:800;letter-spacing:-.03em;margin-top:6px}
.goal .gv span{font-size:14px;color:var(--ink-3);font-weight:600;letter-spacing:0}
.track{height:10px;border-radius:6px;background:var(--card);margin-top:10px;overflow:hidden;position:relative}
.track i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:linear-gradient(90deg,var(--ink-3),var(--ink));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.goal .gl{font-size:12.5px;color:var(--ink-2);margin-top:8px}
.goals-sum{display:flex;gap:18px;margin:0 4px 12px;font-size:13px;color:var(--ink-2)}
.goals-sum b{display:block;color:var(--ink);font-size:17px;font-weight:700;letter-spacing:-.02em}
.empty{padding:22px 16px;text-align:center;color:var(--ink-2);font-size:14px;border:1.5px dashed var(--line);border-radius:22px;line-height:1.5}
.addbtn{width:100%;padding:14px;border-radius:22px;border:1.5px dashed color-mix(in srgb,var(--ink) 18%,transparent);color:var(--ink-2);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px}
.addbtn svg{width:16px;height:16px}

/* accounts */
.narrow{max-width:720px;margin:0 auto}
.acc-head{padding:26px 22px 22px}
.acc-head .lbl{font-size:13px;color:#9B9B9B;font-weight:500}
.acc-head .big{text-align:left;font-size:clamp(38px,10vw,54px)}
.acc-head .usd{text-align:left}
.seg{display:flex;gap:3px;height:10px;margin:20px 0 14px;border-radius:6px;overflow:hidden}
.seg i{display:block;height:100%;border-radius:2px}
.seg-l{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:#A9A9A9}
.seg-l span{display:flex;align-items:center;gap:6px}
.seg-l i{width:8px;height:8px;border-radius:50%}

/* stats */
.stats{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:980px){.stats{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}.stats .wide{grid-column:1/-1}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;background:var(--card-2);color:var(--ink-2)}
.chip.on{background:var(--ink);color:var(--page)}
.cash{background:#0F0F10;color:#EDEDEB;border-radius:28px;padding:20px 18px 14px;position:relative;overflow:hidden}
.cash::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 0%,rgba(255,255,255,.08),transparent 70%);pointer-events:none}
.cash>*{position:relative}
.cash .chip{background:rgba(255,255,255,.08);color:#BDBDBB}
.cash .chip.on{background:#F2F2F0;color:#0A0A0A}
.cash .lbl{font-size:13px;color:#8E8E8E;font-weight:500}
.cash .bigv{font-size:clamp(28px,7vw,38px);font-weight:800;letter-spacing:-.04em;margin-top:4px}
.cash .ch text{fill:#6F6F6F}
.tip{position:absolute;pointer-events:none;background:rgba(40,40,42,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);
  border-radius:14px;padding:10px 12px;font-size:12px;color:#EDEDEB;min-width:170px;transform:translate(-50%,-100%);transition:left .25s,top .25s}
.tip div{display:flex;justify-content:space-between;gap:14px;margin-top:4px}
.tip div:first-child{margin:0 0 6px;color:#9A9A9A}
.cat{display:flex;flex-direction:column;gap:12px}
.cat .ln{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.cat .ln span{color:var(--ink-2);font-weight:500}
.cat .tr{height:8px;background:var(--card-2);border-radius:5px;margin-top:6px;overflow:hidden}
.cat .tr i{display:block;height:100%;border-radius:5px;background:var(--ink)}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;margin-bottom:12px}
.cmp select{width:100%}
.cmp-t{width:100%;border-collapse:collapse;font-size:14px}
.cmp-t td{padding:10px 4px;border-top:1px solid var(--line)}
.cmp-t td:not(:first-child){text-align:right;font-weight:700}
.cmp-t td:first-child{color:var(--ink-2)}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* nav */
.nav{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;display:flex;gap:4px;padding:6px;border-radius:999px;
  background:rgba(12,12,13,.78);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 12px 34px rgba(0,0,0,.28)}
.nav button{width:52px;height:46px;border-radius:999px;display:grid;place-items:center;color:#7D7D80;transition:background .2s,color .2s}
.nav button.on{background:rgba(255,255,255,.12);color:#fff}
.nav button.add{background:#F2F2F0;color:#0A0A0A}

/* sheets */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--sheet);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:30px 30px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .28s cubic-bezier(.2,.9,.25,1)}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:30px;padding:22px}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}@keyframes fade{from{opacity:0}}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sh-h h3{margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em}
.seg3{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border-radius:16px;padding:4px;gap:4px;margin-bottom:16px}
.seg3 button{padding:10px;border-radius:12px;font-weight:600;font-size:14px;color:var(--ink-2)}
.seg3 button.on{background:var(--card-2);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.amt{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:6px 0 2px}
.amt input{font:inherit;font-size:46px;font-weight:800;letter-spacing:-.04em;text-align:center;width:100%;max-width:300px;background:none;border:0;color:var(--ink);padding:0}
.amt input::placeholder{color:var(--ink-3)}.amt input:focus{outline:none}
.amt span{font-size:22px;font-weight:700;color:var(--ink-3)}
.conv{text-align:center;font-size:13.5px;color:var(--ink-2);min-height:20px;margin-bottom:14px}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:12.5px;color:var(--ink-2);font-weight:500;margin:0 4px 6px}
.fld input,.fld select,select.inp{width:100%;font:inherit;font-size:15px;padding:13px 14px;border-radius:16px;border:1px solid var(--line);background:var(--field);color:var(--ink);appearance:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.cats button{padding:8px 13px;border-radius:999px;background:var(--card);font-size:13.5px;font-weight:500;color:var(--ink-2)}
.cats button.on{background:var(--ink);color:var(--page)}
.primary{width:100%;padding:16px;border-radius:18px;background:var(--ink);color:var(--page);font-weight:700;font-size:16px;margin-top:6px}
.ghost{width:100%;padding:14px;border-radius:18px;color:var(--neg);font-weight:600;font-size:14.5px;margin-top:6px}
.err{color:var(--neg);font-size:13px;margin:-4px 4px 10px;min-height:0}
.note{font-size:12.5px;color:var(--ink-2);line-height:1.5;margin:4px 4px 14px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--page);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;animation:up .25s}
.loading{padding:60px 0;text-align:center;color:var(--ink-2)}
.fade-in{animation:fade .35s}
[hidden]{display:none!important}
.sheet.recap{background:#050506;color:#F2F2F0;position:relative;overflow-x:hidden;max-width:460px}
.recap .glow{position:absolute}
.recap>*:not(.glow){position:relative;z-index:1}
.recap .sh-h h3{font-size:13px;font-weight:600;color:#8E8E8E;letter-spacing:.08em;text-transform:uppercase}
.recap .iconbtn{background:rgba(255,255,255,.08);color:#F2F2F0}
.rc-title{font-size:clamp(26px,7vw,32px);font-weight:800;letter-spacing:-.035em;line-height:1.1;margin:0 0 14px;text-wrap:balance}
.rc-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:700;color:#241A06;
  background:linear-gradient(90deg,#B8892B,#EBCB7C 60%,#F7E5AE);box-shadow:0 0 18px rgba(226,186,98,.35);margin-bottom:12px}
.rc-badge svg{width:14px;height:14px}
.rc-lbl{font-size:13px;color:#8E8E8E;font-weight:500}
.recap .big{text-align:left;font-size:clamp(40px,11vw,54px)}
.rc-sub{font-size:14px;color:#A9A9A9;margin-top:6px}
.rc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.rc-tile{border-radius:20px;padding:13px 14px}
.rc-tile .l{font-size:12px;color:#9B9B9B;font-weight:500}
.rc-tile .v{font-size:19px;font-weight:800;letter-spacing:-.03em;margin-top:4px;white-space:nowrap}
.rc-tile .d{font-size:11.5px;color:#7E7E7E;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-radius:18px;padding:13px 15px;margin-top:10px;font-size:14px}

const MON=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MON_P=['январе','феврале','марте','апреле','мае','июне','июле','августе','сентябре','октябре','ноябре','декабре'];

const CUR={RUB:{sym:'₽',dec:2},USD:{sym:'$',dec:2},USDT:{sym:'USDT',dec:2,c:1},BTC:{sym:'BTC',dec:6,c:1},ETH:{sym:'ETH',dec:4,c:1},TON:{sym:'TON',dec:2,c:1},SOL:{sym:'SOL',dec:3,c:1}};
const CATS={income:['Клиенты','Зарплата','Проекты','Крипта','Продажи','Подарок','Другое'],
 expense:['Еда','Кафе','Транспорт','Подписки','Покупки','Жильё','Развлечения','Здоровье','Связь','Другое']};

const S={accounts:[],tx:[],goals:[],rates:{usdRub:80.5381,crypto:{USDT:0.999,BTC:80481,ETH:2347.9,TON:1.24,SOL:101.76},updatedAt:'2026-10-25'},
 ready:{a:0,t:0,g:0},view:'home',hide:false,statMetric:'inc',statSel:null,cmpA:null,cmpB:null,opsFilter:'all',animated:false};
try{S.hide=localStorage.getItem('kap.hide')==='1'}catch(e){}
const h=location.hash.replace('#','');if(['home','stats','accounts','ops'].includes(h))S.view=h;

/* ---------- money ---------- */
const nf=(d)=>new Intl.NumberFormat('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d});
const NF0=nf(0),NF2=nf(2);
function toRub(a,c){a=+a||0;if(c==='RUB')return a;const R=S.rates;if(c==='USD')return a*R.usdRub;return a*(R.crypto?.[c]||0)*R.usdRub}
const toUsd=rub=>rub/S.rates.usdRub;
function rub(v,{sign=false,dec=0}={}){if(S.hide)return '••• ₽';const s=sign&&v>0?'+':v<0?'−':'';return s+(dec?NF2:NF0).format(Math.abs(v))+' ₽'}
function usd(v){if(S.hide)return '$ •••';return '$'+NF2.format(v)}
function usd0(v){if(S.hide)return '$ •••';return '$'+NF0.format(Math.round(v))}
function native(v,c,sign=false){if(S.hide)return '•••';const d=CUR[c]?.dec??2;const s=sign&&v>0?'+':v<0?'−':'';
 const f=new Intl.NumberFormat('ru-RU',{minimumFractionDigits:c==='RUB'?0:Math.min(d,2),maximumFractionDigits:d}).format(Math.abs(v));
 return c==='RUB'?s+f+' ₽':c==='USD'?s+'$'+f:s+f+' '+c}
function short(v){const a=Math.abs(v);return a>=1e6?(v/1e6).toFixed(1).replace('.',',')+'M':a>=1e3?Math.round(v/1e3)+'k':Math.round(v)+''}
function plural(n,a,b,c){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c}

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,'0');
const isoDay=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const mkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const mshift=(k,n)=>{const[y,m]=k.split('-').map(Number);const d=new Date(y,m-1+n,1);return mkey(d)};
const mdays=k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m,0).getDate()};
const mname=(k,arr=MON)=>arr[+k.split('-')[1]-1];
const NOW=new Date(),TODAY=isoDay(NOW),CUR_M=mkey(NOW);
function dayLabel(iso){if(iso===TODAY)return 'Сегодня';const y=new Date(NOW);y.setDate(y.getDate()-1);if(iso===isoDay(y))return 'Вчера';
 const[Y,M,D]=iso.split('-').map(Number);return `${D} ${MON_G[M-1]}${Y!==NOW.getFullYear()?' '+Y:''}`}

/* ---------- derived ---------- */
function accBalance(a){let b=+a.initial||0;for(const t of S.tx){
 if(t.type==='income'&&t.accountId===a.id)b+=+t.amount;
 else if(t.type==='expense'&&t.accountId===a.id)b-=+t.amount;
 else if(t.type==='transfer'){if(t.accountId===a.id)b-=+t.amount;if(t.toAccountId===a.id)b+=+(t.toAmount??t.amount)}}return b}
function txRub(t){return t.rub!=null?+t.rub:toRub(t.amount,t.currency||'RUB')}
function totals(){let r=0,av=0,lk=0;const rows=S.accounts.map(a=>{const b=accBalance(a);const v=toRub(b,a.currency);r+=v;if(a.locked)lk+=v;else av+=v;return{a,b,v}});return{rub:r,avail:av,locked:lk,hasLocked:S.accounts.some(a=>a.locked),rows}}
function month(k){let inc=0,exp=0;const ci={},ce={};for(const t of S.tx){if(!t.date||t.date.slice(0,7)!==k)continue;const v=txRub(t);
 if(t.type==='income'){inc+=v;ci[t.category||'Другое']=(ci[t.category||'Другое']||0)+v}
 else if(t.type==='expense'){exp+=v;ce[t.category||'Другое']=(ce[t.category||'Другое']||0)+v}}return{inc,exp,net:inc-exp,ci,ce}}
function cumSeries(k,type){const D=mdays(k),arr=new Array(D).fill(0);
 for(const t of S.tx){if(t.type!==type||!t.date||t.date.slice(0,7)!==k)continue;const v=txRub(t),day=+t.date.slice(8,10);
  if(t.summary){for(let i=0;i<day;i++)arr[i]+=v/day}else arr[day-1]+=v}
 let c=0;return arr.map(x=>c+=x)}
function monthsRange(){const keys=new Set([CUR_M]);S.tx.forEach(t=>t.date&&keys.add(t.date.slice(0,7)));
 const sorted=[...keys].sort();let k=sorted[0];const out=[];while(k<=CUR_M){out.push(k);k=mshift(k,1)}return out.slice(-12)}

function forecast(){
 const d=NOW.getDate(),D=mdays(CUR_M),left=D-d;
 const E=month(CUR_M).inc,pk=mshift(CUR_M,-1),P=month(pk).inc;
 const hist=[1,2,3].map(n=>month(mshift(CUR_M,-n)).inc).filter(v=>v>0);
 const avg=hist.length?hist.reduce((a,b)=>a+b,0)/hist.length:0;
 const proj=d?E/d*D:0;
 if(!E&&!P)return null;
 const pP=mname(pk,MON_P),pG=mname(pk,MON_G),dl=`${left} ${plural(left,'день','дня','дней')}`;
 if(P>0&&E>=P)return{up:1,t:`Вы уже заработали больше, чем в ${pP}`,s:`+${rub(E-P)} сверху · прогноз на месяц ${rub(proj)}`};
 if(P>0&&proj>=P)return{up:1,t:`У вас все шансы заработать больше, чем в ${pP}`,s:`Прогноз ${rub(proj)} · до ${pG} осталось ${rub(P-E)}`};
 if(avg>0&&proj>=avg)return{up:1,t:`Месяц идёт выше среднего на ${Math.round((proj/avg-1)*100)}%`,s:`До уровня ${pG} ещё ${rub(P-E)} за ${dl} · прогноз ${rub(proj)}`};
 if(P>0)return{up:0,t:`Чтобы обогнать ${mname(pk)}, нужно ещё ${rub(P-E)}`,s:`Осталось ${dl} · это ${rub((P-E)/Math.max(left,1))} в день`};
 return{up:1,t:`Первый месяц учёта`,s:`Прогноз на месяц ${rub(proj)}`}}

/* ---------- db ---------- */
let db=null,sb=null,MODE=null,ratesTried=false;
const $view=()=>document.getElementById('view');
async function boot(){
 if(window.claude?.use){try{db=await window.claude.use('db')}catch(e){db=null}if(db){MODE='claude';subscribe();return}}
 const cfg=window.KAPITAL_CONFIG;
 if(!cfg?.supabaseUrl||!cfg?.supabaseAnonKey||!window.supabase){$view().innerHTML='<div class="empty">Хранилище не настроено. Впиши адрес и ключ Supabase в файл config.js.</div>';return}
 MODE='supabase';
 sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 const {data}=await sb.auth.getSession();
 sb.auth.onAuthStateChange((ev,ses)=>{if(ev==='SIGNED_OUT')location.reload();if(ev==='SIGNED_IN'&&ses&&!db)startSupa(ses.user)});
 if(data.session)startSupa(data.session.user);else showAuth();
}
function startSupa(user){S.email=user.email;db=supaDb(sb,user.id);document.getElementById('nav').hidden=false;subscribe()}
function subscribe(){
 document.getElementById('setBtn').hidden=false;
 const onErr=e=>toast('Ошибка синхронизации: '+(e?.message||''));
 db.collection('accounts').onSnapshot(s=>{S.accounts=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order??99)-(b.order??99));S.ready.a=1;render()},onErr);
 db.collection('tx').onSnapshot(s=>{S.tx=s.docs.map(d=>({id:d.id,...d.data()}));S.ready.t=1;render()},onErr);
 db.collection('goals').onSnapshot(s=>{S.goals=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));S.ready.g=1;render()},onErr);
 db.doc('meta/rates').onSnapshot(s=>{if(s.exists){const r=s.data();S.rates={...S.rates,...r,crypto:{...S.rates.crypto,...(r.crypto||{})}}}render();autoRates()},onErr);
}
/* Supabase: one table "docs" (user_id, path, data jsonb), shaped like the claude db API above */
function supaDb(sb,uid){
 let cache=null;const subs=new Set(),emit=()=>subs.forEach(f=>f());
 const load=async()=>{const{data,error}=await sb.from('docs').select('path,data');if(error){toast('Не удалось загрузить данные: '+error.message);return}cache=new Map(data.map(r=>[r.path,r.data]));emit()};
 sb.channel('docs-'+uid).on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'user_id=eq.'+uid},()=>load()).subscribe();
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')load()});
 load();
 const put=async rows=>{const{error}=await sb.from('docs').upsert(rows.map(([path,data])=>({user_id:uid,path,data,updated_at:new Date().toISOString()})));if(error)throw error;rows.forEach(([p,d])=>cache.set(p,d));emit()};
 const listen=f=>{subs.add(f);if(cache)f();return()=>subs.delete(f)};
 return{
  collection:c=>({onSnapshot:f=>listen(()=>f({docs:[...cache].filter(([p])=>p.startsWith(c+'/')).map(([p,d])=>({id:p.slice(c.length+1),exists:true,data:()=>d}))})),
   add:async d=>{const id=Date.now().toString(36)+Math.random().toString(36).slice(2,7);await put([[c+'/'+id,d]]);return{id}}}),
  doc:p=>({onSnapshot:f=>listen(()=>f({exists:cache.has(p),data:()=>cache.get(p)})),set:d=>put([[p,d]]),update:d=>put([[p,{...(cache.get(p)||{}),...d}]]),
   delete:async()=>{const{error}=await sb.from('docs').delete().eq('user_id',uid).eq('path',p);if(error)throw error;cache.delete(p);emit()}}),
  bulk:put};
}
async function autoRates(){
 if(ratesTried||S.rates.updatedAt===TODAY)return;ratesTried=true;
 try{const[c,g]=await Promise.all([fetch('https://www.cbr-xml-daily.ru/daily_json.js').then(r=>r.json()),
   fetch('https://api.coingecko.com/api/v3/simple/price?ids=tether,bitcoin,ethereum,the-open-network,solana&vs_currencies=usd').then(r=>r.json())]);
  const u=+c?.Valute?.USD?.Value;if(!(u>30&&u<300))return;
  const map={tether:'USDT',bitcoin:'BTC',ethereum:'ETH','the-open-network':'TON',solana:'SOL'},crypto={...S.rates.crypto};
  for(const k in map)if(g?.[k]?.usd>0)crypto[map[k]]=g[k].usd;
  await db.doc('meta/rates').set({usdRub:u,crypto,updatedAt:TODAY})}catch(e){}
}
function showAuth(){
 document.getElementById('nav').hidden=true;
 $view().innerHTML=`<div class="auth"><section class="hero" data-light><div class="glow"></div><div class="glow g2"></div>
  <div class="avatar" style="margin:0 auto">₽</div><div class="big">Капитал</div><p class="auth-sub">Войди, чтобы увидеть свои деньги</p>
  <form id="au-form"><input class="ainp" id="au-email" type="email" autocomplete="email" placeholder="Почта" required>
  <input class="ainp" id="au-pass" type="password" autocomplete="current-password" placeholder="Пароль" minlength="6" required>
  <div class="err" id="au-err"></div><button class="auth-btn" id="au-in" type="submit">Войти</button>
  <button class="glass act" id="au-up" type="button">Создать аккаунт</button></form></section></div>`;
 bindLight();
 const err=t=>document.getElementById('au-err').textContent=t,val=()=>[document.getElementById('au-email').value.trim(),document.getElementById('au-pass').value];
 const RU={'Invalid login credentials':'Неверная почта или пароль','User already registered':'Такой аккаунт уже есть, просто войди','Email not confirmed':'Подтверди почту по ссылке из письма','Signups not allowed for this instance':'Регистрация закрыта'};
 document.getElementById('au-form').onsubmit=async e=>{e.preventDefault();const[em,pw]=val();err('');
  const{error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)err(RU[error.message]||error.message)};
 document.getElementById('au-up').onclick=async()=>{const[em,pw]=val();if(!em||pw.length<6){err('Введи почту и пароль от 6 символов');return}err('');
  const{data,error}=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname}});
  if(error){err(RU[error.message]||error.message);return}if(!data.session)err('Готово. Подтверди почту по ссылке из письма и войди.')};
}

function kpiHTML(k){const m=month(k),pk=mshift(k,-1),day=Math.min(NOW.getDate(),mdays(pk));

function lineChart(){
 const k=CUR_M,pk=mshift(k,-1),cur=cumSeries(k,'income'),prev=cumSeries(pk,'income');
 const W=600,H=210,pl=4,pr=4,pt=14,pb=26,D=Math.max(cur.length,prev.length),d=NOW.getDate();
 const max=Math.max(1,...prev,...cur.slice(0,d))*1.08;
 const x=i=>pl+(W-pl-pr)*(i/(D-1)),y=v=>pt+(H-pt-pb)*(1-v/max);
 const path=a=>a.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
 const curPts=cur.slice(0,d),ex=x(d-1),ey=y(curPts[d-1]||0);
 const ticks=[1,10,20,D].map(t=>`<text x="${x(t-1)}" y="${H-6}" text-anchor="${t===1?'start':t===D?'end':'middle'}">${t}</text>`).join('');
 const dots=Array.from({length:D},(_, i)=>`<circle cx="${x(i)}" cy="${H-pb+6}" r="1" fill="var(--ink-3)"/>`).join('');
 return `<div class="legend"><span><i style="background:var(--ink)"></i>${mname(k)}</span><span><i style="background:var(--ink-3)"></i>${mname(pk)}</span></div>
 <svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Накопленный доход: ${mname(k)} против ${mname(pk)}">
  <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--ink)" stop-opacity=".16"/><stop offset="1" stop-color="var(--ink)" stop-opacity="0"/></linearGradient></defs>
  ${prev.length?`<path d="${path(prev)}" fill="none" stroke="var(--ink-3)" stroke-opacity=".55" stroke-width="2.5" stroke-linejoin="round"/>`:''}
  <path d="${path(curPts)}L${ex},${H-pb}L${x(0)},${H-pb}Z" fill="url(#ga)"/>
  <path d="${path(curPts)}" fill="none" stroke="var(--ink)" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="${ex}" x2="${ex}" y1="${pt-6}" y2="${H-pb}" stroke="var(--ink-3)" stroke-dasharray="3 4"/>
  <circle cx="${ex}" cy="${ey}" r="9" fill="var(--ink)" fill-opacity=".12"/><circle cx="${ex}" cy="${ey}" r="4.5" fill="var(--ink)"/>
  ${dots}${ticks}
 </svg>`}

function vStats(){

 const withInc=all.filter(x=>x.inc>0),done=withInc.filter(x=>x.k!==CUR_M),best=withInc.reduce((a,b)=>b.inc>(a?.inc||0)?b:a,null);
 const avg=done.length?done.reduce((s,x)=>s+x.inc,0)/done.length:0;
 const totInc=all.reduce((s,x)=>s+x.inc,0),totExp=all.reduce((s,x)=>s+x.exp,0);
 const catBlock=(obj,empty)=>{const e=Object.entries(obj).sort((a,b)=>b[1]-a[1]);const mx=e[0]?.[1]||1;const sm=e.reduce((s,x)=>s+x[1],0);
  return e.length?`<div class="cat">${e.map(([n,v])=>`<div><div class="ln"><b style="font-weight:600">${esc(n)}</b><span class="num">${rub(v)} · ${Math.round(v/sm*100)}%</span></div><div class="tr"><i style="width:${v/mx*100}%"></i></div></div>`).join('')}</div>`:`<div class="empty">${empty}</div>`};
 const A=month(S.cmpA),B=month(S.cmpB);
 const dl=(a,b)=>!a?'—':`<span class="${b>=a?'up':'down'}">${b>=a?'+':'−'}${Math.round(Math.abs(b/a-1)*100)}%</span>`;
 const mo=k=>`${mname(k)} ${k.slice(0,4)}`;
 const opt=sel=>months.map(k=>`<option value="${k}" ${k===sel?'selected':''}>${mo(k)}</option>`).join('');
 const metricLbl={inc:'Доход',exp:'Расход',net:'Чистый итог'}[S.statMetric];
 return `<div class="stats">
 <section class="cash wide" id="cash">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
   <div><div class="lbl">${metricLbl} · ${mo(S.statSel)}</div><div class="bigv num">${rub(m[S.statMetric])}</div></div>
   <div class="chips"><button class="chip gold-chip" data-recap="${S.statSel}">${ic('star')}Итог ${mname(S.statSel).slice(0,3)}.</button>${[['inc','Доход'],['exp','Расход'],['net','Итог']].map(([k,l])=>`<button class="chip ${S.statMetric===k?'on':''}" data-metric="${k}">${l}</button>`).join('')}</div>
  </div>
  <div style="position:relative;margin-top:14px">${barChart(all)}<div class="tip" id="tip" hidden></div></div>
 </section>
 <section class="card"><div class="sec-h"><h2>Откуда пришли деньги</h2><span style="font-size:13px;color:var(--ink-2)">${mname(S.statSel)}</span></div>${catBlock(m.ci,'В этом месяце доходов нет.')}</section>
 <section class="card"><div class="sec-h"><h2>Куда ушли деньги</h2><span style="font-size:13px;color:var(--ink-2)">${mname(S.statSel)}</span></div>${catBlock(m.ce,'Расходов за этот месяц пока нет. Добавляй их через «+», и здесь появится разбивка по категориям.')}</section>
 <section class="card"><div class="sec-h"><h2>Сравнение месяцев</h2></div>
  <div class="cmp"><select class="inp" id="cmpA" aria-label="Первый месяц">${opt(S.cmpA)}</select><span style="color:var(--ink-3)">vs</span><select class="inp" id="cmpB" aria-label="Второй месяц">${opt(S.cmpB)}</select></div>
  <table class="cmp-t num"><tr><td></td><td>${mname(S.cmpA).slice(0,3)}</td><td>${mname(S.cmpB).slice(0,3)}</td><td>Δ</td></tr>

   <tr><td>Расход</td><td>${rub(A.exp)}</td><td>${rub(B.exp)}</td><td>${A.exp?`<span class="${B.exp<=A.exp?'up':'down'}">${B.exp>=A.exp?'+':'−'}${Math.round(Math.abs(B.exp/A.exp-1)*100)}%</span>`:'—'}</td></tr>
   <tr><td>Итог</td><td>${rub(A.net)}</td><td>${rub(B.net)}</td><td>${dl(A.net,B.net)}</td></tr></table>
 </section>
 <section class="card"><div class="sec-h"><h2>Рекорды</h2></div><div class="recs">
  <div class="kpi"><div class="l">Лучший месяц</div><div class="v num">${best?rub(best.inc):'—'}</div><div class="d">${best?mo(best.k):''}</div></div>

  <div class="kpi"><div class="l">Заработано всего</div><div class="v num">${rub(totInc)}</div><div class="d">с ${mname(months[0],MON_G)}</div></div>
  <div class="kpi"><div class="l">Норма сбережений</div><div class="v num">${totInc?Math.round((totInc-totExp)/totInc*100)+'%':'—'}</div><div class="d">доля дохода, что осталась</div></div>
 </div></section></div>`}

function barChart(all){
 const W=Math.max(320,all.length*72),H=240,pl=40,pb=26,pt=10;
 const vals=all.map(x=>x[S.statMetric]);const max=Math.max(1,...vals.map(Math.abs))*1.1;
 const step=niceStep(max/4),top=Math.ceil(max/step)*step;
 const y=v=>pt+(H-pt-pb)*(1-Math.max(v,0)/top),bw=Math.min(52,(W-pl)/all.length*0.68);
 const grid=[0,1,2,3,4].map(i=>i*step).filter(v=>v<=top).map(v=>`<text x="${pl-10}" y="${y(v)+4}" text-anchor="end">${short(v)}</text><line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#fff" stroke-opacity=".05"/>`).join('');
 const bars=all.map((x,i)=>{const cx=pl+(W-pl)/all.length*(i+.5),v=x[S.statMetric],hh=Math.max(4,y(0)-y(Math.abs(v))),sel=x.k===S.statSel,neg=v<0;
  return `<g data-bar="${x.k}" data-cx="${cx}" data-cy="${y(0)-hh}" style="cursor:pointer">
   <rect x="${cx-bw/2-6}" y="${pt}" width="${bw+12}" height="${H-pt-pb}" fill="transparent"/>
   <rect x="${cx-bw/2}" y="${y(0)-hh}" width="${bw}" height="${hh}" rx="${Math.min(12,bw/3)}" fill="${sel?'url(#bs)':'url(#bn)'}" ${neg?'stroke="#F07A6E" stroke-opacity=".7" stroke-dasharray="4 3"':''}/>
   ${sel?`<circle cx="${cx}" cy="${y(0)-hh+12}" r="7" fill="#fff" fill-opacity=".35" stroke="#fff" stroke-width="1.5"/>`:''}
   <text x="${cx}" y="${H-6}" text-anchor="middle" style="${sel?'fill:#EDEDEB;font-weight:600':''}">${MON_S[+x.k.slice(5)-1]}</text></g>`}).join('');
 return `<div style="overflow-x:auto"><svg class="ch" viewBox="0 0 ${W} ${H}" style="min-width:${all.length>6?all.length*52:0}px" role="img" aria-label="${S.statMetric==='inc'?'Доход':S.statMetric==='exp'?'Расход':'Итог'} по месяцам">
 <defs><linearGradient id="bs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#C9C9C7"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".9"/></linearGradient>
 <linearGradient id="bn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3C3C3F"/><stop offset="1" stop-color="#1A1A1C"/></linearGradient></defs>
 ${grid}${bars}</svg></div>`}
function niceStep(r){const p=Math.pow(10,Math.floor(Math.log10(Math.max(r,1))));const n=r/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}

function bindBars(){
 const tip=document.getElementById('tip'),wrap=tip?.parentElement;if(!tip)return;
 const show=(g)=>{const k=g.dataset.bar,m=month(k),svg=g.ownerSVGElement,r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal,wr=wrap.getBoundingClientRect();

/* ---------- light on glass ---------- */
let lightEls=[],ptr=null,raf=0;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function bindLight(){lightEls=[...document.querySelectorAll('[data-light]')].map(hero=>({hero,g:hero.querySelectorAll('.glow'),gl:hero.querySelectorAll('.glass')}));
 lightEls.forEach(L=>{L.hero.addEventListener('pointermove',e=>{const r=L.hero.getBoundingClientRect();L.p={x:e.clientX-r.left,y:e.clientY-r.top,t:performance.now()}});
  L.hero.addEventListener('pointerleave',()=>{L.p=null})});
 if(!raf)raf=requestAnimationFrame(tick)}
function tick(t){raf=requestAnimationFrame(tick);
 for(const L of lightEls){if(!L.hero.isConnected)continue;const r=L.hero.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)continue;
  const s=RM?0:t/1000;let x=r.width*(.5+.36*Math.sin(s*.37)),y=r.height*(.42+.3*Math.sin(s*.53+1));
  if(L.p){L.cur=L.cur||{x,y};x=L.p.x;y=L.p.y}
  L.cur=L.cur?{x:L.cur.x+(x-L.cur.x)*.08,y:L.cur.y+(y-L.cur.y)*.08}:{x,y};
  const x2=r.width*(.5+.4*Math.cos(s*.29)),y2=r.height*(.7+.2*Math.sin(s*.41));
  if(L.g[0])L.g[0].style.transform=`translate(${L.cur.x}px,${L.cur.y}px)`;if(L.g[1])L.g[1].style.transform=`translate(${x2}px,${y2}px)`;
  for(const e of L.gl){const b=e.getBoundingClientRect();e.style.setProperty('--lx',(r.left+L.cur.x-b.left)+'px');e.style.setProperty('--ly',(r.top+L.cur.y-b.top)+'px')}}}

function countUp(){const el=document.querySelector('[data-big] [data-int]');if(!el||RM||S.hide)return;const target=Math.trunc(Math.abs(+document.querySelector('[data-big]').dataset.big));
 const t0=performance.now(),dur=1100;const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,4);el.textContent=NF0.format(Math.round(target*e));if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}

/* ---------- month recap ---------- */
function recapData(k){
 const m=month(k),pk=mshift(k,-1),p=month(pk);
 const hist=[];let x=k;for(let i=0;i<24;i++){const mm=month(x);if(mm.inc||mm.exp)hist.push({k:x,...mm});x=mshift(x,-1)}
 const ranked=hist.filter(h=>h.inc>0).sort((a,b)=>b.inc-a.inc),rank=ranked.findIndex(h=>h.k===k)+1;
 const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1])[0];
 const txs=S.tx.filter(t=>t.date?.slice(0,7)===k&&!t.summary);
 const bigExp=txs.filter(t=>t.type==='expense').sort((a,b)=>txRub(b)-txRub(a))[0];
 return{k,m,p,pk,rank,count:ranked.length,record:rank===1&&ranked.length>1,topIn:top(m.ci),topOut:top(m.ce),bigExp,ops:txs.length,
  perDay:m.inc/mdays(k),rate:m.inc?(m.inc-m.exp)/m.inc:null,bars:[5,4,3,2,1,0].map(n=>{const kk=mshift(k,-n);return{k:kk,v:month(kk).inc}})}}
function recapSheet(k){
 const d=recapData(k),{m,p}=d,pc=p.inc?Math.round((m.inc/p.inc-1)*100):null;
 const title=d.record?`Лучший месяц за всё время`:pc==null?`Итоги ${mname(k,MON_G)}`:pc>=0?`Вы заработали больше, чем в ${mname(d.pk,MON_P)}, на ${pc}%`:`Меньше, чем в ${mname(d.pk,MON_P)}, на ${Math.abs(pc)}%`;
 const mx=Math.max(1,...d.bars.map(b=>b.v));let i=0;const st=()=>`style="--i:${i++}"`;
 const tile=(l,v,dd,cls='')=>`<div class="glass rc-tile rc-in" ${st()}><div class="l">${l}</div><div class="v num ${cls}">${v}</div>${dd?`<div class="d">${dd}</div>`:''}</div>`;
 const row=(l,v)=>`<div class="glass rc-row rc-in" ${st()}><span>${l}</span><b>${v}</b></div>`;
 openSheet(`${mname(k)} ${k.slice(0,4)}`,`<div class="glow"></div><div class="glow g2"></div>
  ${d.record?`<div class="rc-badge rc-in" ${st()}>${ic('star')}Рекорд</div>`:''}
  <div class="rc-title rc-in" ${st()}>${esc(title)}</div>
  <div class="rc-lbl rc-in" ${st()}>Заработано за ${mname(k)}</div>
  <div class="big num rc-in" ${st()}>${bigAmount(m.inc)}</div>
  <div class="rc-sub num rc-in" ${st()}>${usd(toUsd(m.inc))}${d.count>1?` · ${d.rank}-е место из ${d.count} ${plural(d.count,'месяца','месяцев','месяцев')}`:''}</div>
  <div class="rc-bars rc-in" ${st()}>${d.bars.map(b=>`<div class="${b.k===k?'on':''}"><i style="height:${Math.max(4,b.v/mx*100)}%"></i><small>${MON_S[+b.k.slice(5)-1]}</small></div>`).join('')}</div>
  <div class="rc-grid">
   ${tile('Потрачено',rub(m.exp),p.exp?`${m.exp<=p.exp?'▼':'▲'} ${Math.abs(Math.round((m.exp/p.exp-1)*100))}% к ${mname(d.pk,MON_G).slice(0,3)}.`:'')}
   ${tile('Осталось',rub(m.net,{sign:true}),d.rate!=null&&m.exp?`${Math.round(d.rate*100)}% дохода сохранено`:'',m.net>=0?'':'down')}
   ${tile('В среднем в день',rub(d.perDay),'доход')}
   ${tile('К прошлому месяцу',pc==null?'—':`${pc>=0?'+':'−'}${Math.abs(pc)}%`,p.inc?`${mname(d.pk)}: ${rub(p.inc)}`:'',pc==null?'':pc>=0?'up':'down')}
  </div>
  ${d.topIn&&d.topIn[0]!=='Итог месяца'?row('Главный источник',`${esc(d.topIn[0])} · ${rub(d.topIn[1])}`):''}
  ${d.topOut?row('Больше всего ушло на',`${esc(d.topOut[0])} · ${rub(d.topOut[1])}`):''}
  ${d.bigExp?row('Самая крупная трата',`${esc(d.bigExp.note||d.bigExp.category)} · ${rub(txRub(d.bigExp))}`):''}
  ${d.ops?row('Операций за месяц',d.ops):''}
  ${S.goals.length?row('Отложено на цели',`<span style="color:#E4BF6C">${usd0(S.goals.reduce((s,g)=>s+(+g.saved||0),0))}</span>`):''}
  <button class="auth-btn rc-in" ${st()} data-close style="margin-top:18px">Отлично</button>`,()=>bindLight(),'recap');
 try{localStorage.setItem('kap.recap',k)}catch(_){}
}
function maybeAutoRecap(){const pk=mshift(CUR_M,-1),pm=month(pk);if(NOW.getDate()>3||!(pm.inc||pm.exp)||layer.innerHTML)return;
 let seen='';try{seen=localStorage.getItem('kap.recap')||''}catch(_){}if(seen>=pk)return;recapSheet(pk)}
let tt;function toast(m){clearTimeout(tt);document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);tt=setTimeout(()=>d.remove(),2200)}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const n=e.target.closest('[data-nav]');if(n){const v=n.dataset.nav;if(v==='add'){txSheet('expense');return}S.view=v;try{history.replaceState(null,'','#'+v)}catch(_){}render();scrollTo(0,0);return}
 const ad=e.target.closest('[data-add]');if(ad){txSheet(ad.dataset.add);return}
 const a=e.target.closest('[data-act]');if(a){const k=a.dataset.act;if(k==='rates')ratesSheet();if(k==='goal-new')goalSheet();if(k==='acc-new')accSheet();return}
 const tx=e.target.closest('[data-tx]');if(tx){const t=S.tx.find(x=>x.id===tx.dataset.tx);if(t)txSheet(t.type,t);return}
 const ac=e.target.closest('[data-acc]');if(ac){accSheet(S.accounts.find(x=>x.id===ac.dataset.acc));return}
 const g=e.target.closest('[data-goal]');if(g){goalSheet(S.goals.find(x=>x.id===g.dataset.goal));return}
 const o=e.target.closest('[data-ops]');if(o){S.opsFilter=o.dataset.ops;render();return}
 const mt=e.target.closest('[data-metric]');if(mt){S.statMetric=mt.dataset.metric;render();return}
 const rc=e.target.closest('[data-recap]');if(rc){recapSheet(rc.dataset.recap);return}
 const b=e.target.closest('[data-bar]');if(b){S.statSel=b.dataset.bar;render();return}
 if(e.target.closest('#setBtn')){settingsSheet();return}
 if(e.target.closest('#hideBtn')){S.hide=!S.hide;try{localStorage.setItem('kap.hide',S.hide?'1':'0')}catch(_){}render()}
});
document.addEventListener('change',e=>{if(e.target.id==='cmpA'){S.cmpA=e.target.value;render()}if(e.target.id==='cmpB'){S.cmpB=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&layer.innerHTML)closeSheet()});
render();boot();
</script>
</body></html>
